name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  smoke:
    name: Clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # hatch-vcs needs full history + tags to derive the version
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Clean-install smoke
        run: bash scripts/smoke-install.sh

  build-and-publish:
    name: Build and publish to PyPI
    needs: smoke   # never publish a wheel that fails to install + self-describe clean
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC trusted publishing
      contents: read    # required so actions/checkout@v6 can read the repo
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # hatch-vcs needs full history + tags to derive the version

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
